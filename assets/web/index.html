<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server WebPanel · 仪表盘</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', '"Fira Code"', 'Consolas', 'monospace'],
          },
          colors: {
            minecraft: { green: '#5D8C2A', brown: '#835D3B', stone: '#8B8B83' }
          }
        }
      }
    }
  </script>
  <style>
    .log-line { transition: background 0.15s; }
    .log-line:hover { background-color: rgba(255,255,255,0.06); }
    .pulse-dot {
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }
    .modal-overlay { background-color: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">
  <!-- 顶部导航 -->
  <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h10a4 4 0 004-4M3 9a4 4 0 014-4h10a4 4 0 014 4M7 21h10" />
          </svg>
        </div>
        <h1 class="text-lg font-semibold tracking-tight">Server<span class="text-emerald-400">Panel</span></h1>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span id="status-dot" class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
          <span id="status-text" class="text-sm hidden sm:inline">检测中…</span>
        </div>
        <button id="refresh-btn" class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition" title="刷新">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <!-- 服务器状态 -->
      <section class="lg:col-span-3 bg-gray-900/70 rounded-2xl border border-gray-800 p-5 shadow-xl">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <h2 class="text-xl font-bold flex items-center gap-2"><span class="text-emerald-400">📡</span> 服务器状态</h2>
          <div id="server-status-content" class="hidden flex items-center gap-6">
            <span class="text-sm"><span class="text-gray-400">状态：</span><span id="server-badge" class="px-2 py-0.5 rounded-full text-xs bg-emerald-900 text-emerald-300">运行中</span></span>
            <span class="text-sm"><span class="text-gray-400">玩家：</span><span id="player-count" class="font-semibold">0</span> 人</span>
          </div>
          <div id="server-status-loading" class="animate-pulse text-sm text-gray-500">加载中...</div>
        </div>
      </section>

      <!-- 在线玩家 -->
      <section class="lg:col-span-1 bg-gray-900/70 rounded-2xl border border-gray-800 p-5 shadow-xl flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-bold flex items-center gap-2"><span class="text-sky-400">👥</span> 在线玩家</h3>
          <span id="online-count-badge" class="bg-gray-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="players-loading" class="animate-pulse space-y-2"><div class="h-4 bg-gray-700 rounded w-3/4"></div><div class="h-4 bg-gray-700 rounded w-1/2"></div></div>
        <div id="players-error" class="hidden text-red-400 text-sm">加载失败</div>
        <div id="players-empty" class="hidden text-gray-500 text-sm">暂无玩家在线</div>
        <ul id="players-list" class="hidden space-y-2 overflow-y-auto max-h-80 pr-1 custom-scroll"></ul>
      </section>

      <!-- 日志与死亡 -->
      <section class="lg:col-span-2 space-y-5">
        <!-- 方块日志 -->
        <div class="bg-gray-900/70 rounded-2xl border border-gray-800 p-5 shadow-xl">
          <h3 class="text-lg font-bold flex items-center gap-2 mb-3"><span class="text-amber-400">⛏️</span> 方块操作日志</h3>
          <div class="flex gap-2 mb-4">
            <input type="text" id="log-player-input" placeholder="玩家名或UUID" class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm" />
            <button id="log-search-btn" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg text-sm">查询</button>
            <button id="log-clear-btn" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm text-gray-400">清除</button>
          </div>
          <div id="log-initial" class="text-gray-500 text-sm text-center py-8">输入玩家名查看方块破坏/放置记录</div>
          <div id="log-loading" class="hidden justify-center py-8"><div class="animate-spin rounded-full h-8 w-8 border-2 border-amber-400 border-t-transparent"></div></div>
          <div id="log-error" class="hidden text-red-400 text-sm py-4">查询失败</div>
          <div id="log-empty" class="hidden text-gray-500 text-sm py-4">没有记录</div>
          <div id="log-content" class="hidden">
            <div class="overflow-x-auto max-h-80 overflow-y-auto">
              <table class="w-full text-sm">
                <thead class="text-xs uppercase bg-gray-800 text-gray-400 sticky top-0">
                  <tr><th class="px-3 py-2">操作</th><th class="px-3 py-2">方块</th><th class="px-3 py-2">工具</th><th class="px-3 py-2">次数</th><th class="px-3 py-2">坐标</th><th class="px-3 py-2">时间</th></tr>
                </thead>
                <tbody id="log-table-body" class="divide-y divide-gray-800"></tbody>
              </table>
            </div>
            <div class="flex justify-between mt-3">
              <span id="log-cursor-info" class="text-xs text-gray-500"></span>
              <button id="log-load-more-btn" class="hidden px-3 py-1 text-xs bg-amber-600 hover:bg-amber-500 rounded">加载更多</button>
            </div>
          </div>
        </div>

        <!-- 死亡历史 -->
        <div class="bg-gray-900/70 rounded-2xl border border-gray-800 p-5 shadow-xl">
          <h3 class="text-lg font-bold flex items-center gap-2 mb-3"><span class="text-red-400">💀</span> 死亡历史</h3>
          <div class="flex gap-2 mb-4">
            <input type="text" id="death-player-input" placeholder="玩家名或UUID" class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm" />
            <button id="death-search-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg text-sm">查询</button>
            <button id="death-clear-btn" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm text-gray-400">清除</button>
          </div>
          <div id="death-initial" class="text-gray-500 text-sm text-center py-8">输入玩家名查看死亡记录</div>
          <div id="death-loading" class="hidden justify-center py-8"><div class="animate-spin rounded-full h-8 w-8 border-2 border-red-400 border-t-transparent"></div></div>
          <div id="death-error" class="hidden text-red-400 text-sm py-4">查询失败</div>
          <div id="death-empty" class="hidden text-gray-500 text-sm py-4">没有死亡记录</div>
          <div id="death-content" class="hidden">
            <div class="overflow-x-auto max-h-80 overflow-y-auto">
              <table class="w-full text-sm">
                <thead class="text-xs uppercase bg-gray-800 text-gray-400 sticky top-0">
                  <tr><th class="px-3 py-2">时间</th><th class="px-3 py-2">维度</th><th class="px-3 py-2">坐标</th><th class="px-3 py-2">死因</th><th class="px-3 py-2">攻击者</th></tr>
                </thead>
                <tbody id="death-table-body" class="divide-y divide-gray-800"></tbody>
              </table>
            </div>
            <div class="flex justify-between mt-3">
              <span id="death-cursor-info" class="text-xs text-gray-500"></span>
              <button id="death-load-more-btn" class="hidden px-3 py-1 text-xs bg-red-600 hover:bg-red-500 rounded">加载更多</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 状态模态框 -->
  <div id="status-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-lg shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold" id="modal-player-name">玩家状态</h3>
        <button id="close-modal" class="text-gray-400 hover:text-white p-1">&times;</button>
      </div>
      <div id="modal-content" class="space-y-2 text-sm"></div>
    </div>
  </div>

  <script>
    (function() {
      const BASE = '';
      const LOG = (...args) => console.log('[WebPanel]', ...args);
      const ERR = (...args) => console.error('[WebPanel]', ...args);

      const API = {
        status: () => fetch(`${BASE}/`, {headers: {'Accept': 'application/json'}}).then(r => r.json()).catch(e => { ERR('status fetch failed', e); return null; }),
        players: () => fetch(`${BASE}/api/players`).then(r => r.json()).catch(e => { ERR('players fetch failed', e); return null; }),
        playerActions: (id, limit=20, before=0) => {
          const p = new URLSearchParams({type:'block', limit});
          if(before) p.set('before', before);
          return fetch(`${BASE}/api/player/${encodeURIComponent(id)}/actions?${p}`).then(r => {
            if(!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          }).catch(e => { ERR('actions fetch failed', e); throw e; });
        },
        playerStatus: (id) => fetch(`${BASE}/api/player/${encodeURIComponent(id)}/status`).then(r => {
          if(!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }).catch(e => { ERR('status fetch failed', e); throw e; }),
        playerDeaths: (id, limit=20, before=0) => {
          const p = new URLSearchParams({limit});
          if(before) p.set('before', before);
          return fetch(`${BASE}/api/player/${encodeURIComponent(id)}/deaths?${p}`).then(r => {
            if(!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          }).catch(e => { ERR('deaths fetch failed', e); throw e; });
        }
      };

      // UI元素引用
      const $ = (sel) => document.querySelector(sel);
      const statusDot = $('#status-dot');
      const statusText = $('#status-text');
      const serverStatusContent = $('#server-status-content');
      const serverStatusLoading = $('#server-status-loading');
      const serverBadge = $('#server-badge');
      const playerCountEl = $('#player-count');
      const playersLoading = $('#players-loading');
      const playersError = $('#players-error');
      const playersEmpty = $('#players-empty');
      const playersList = $('#players-list');
      const onlineCountBadge = $('#online-count-badge');
      const logPlayerInput = $('#log-player-input');
      const logSearchBtn = $('#log-search-btn');
      const logClearBtn = $('#log-clear-btn');
      const logInitial = $('#log-initial');
      const logLoading = $('#log-loading');
      const logError = $('#log-error');
      const logEmpty = $('#log-empty');
      const logContent = $('#log-content');
      const logTableBody = $('#log-table-body');
      const logLoadMoreBtn = $('#log-load-more-btn');
      const deathPlayerInput = $('#death-player-input');
      const deathSearchBtn = $('#death-search-btn');
      const deathClearBtn = $('#death-clear-btn');
      const deathInitial = $('#death-initial');
      const deathLoading = $('#death-loading');
      const deathError = $('#death-error');
      const deathEmpty = $('#death-empty');
      const deathContent = $('#death-content');
      const deathTableBody = $('#death-table-body');
      const deathLoadMoreBtn = $('#death-load-more-btn');
      const statusModal = $('#status-modal');
      const modalPlayerName = $('#modal-player-name');
      const modalContent = $('#modal-content');

      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

      // 服务器状态
      async function refreshStatus() {
        const data = await API.status();
        serverStatusLoading.classList.add('hidden');
        serverStatusContent.classList.remove('hidden');
        if (data && data.status === 'running') {
          statusDot.innerHTML = '<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>';
          statusText.textContent = '已连接';
          statusText.className = 'text-sm text-gray-300 hidden sm:inline';
          serverBadge.textContent = '运行中';
          serverBadge.className = 'px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-900 text-emerald-300';
        } else {
          statusDot.innerHTML = '<span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>';
          statusText.textContent = '离线';
          statusText.className = 'text-sm text-red-400 hidden sm:inline';
          serverBadge.textContent = '离线';
          serverBadge.className = 'px-2 py-0.5 text-xs font-semibold rounded-full bg-red-900 text-red-300';
        }
      }

      // 玩家列表
      async function refreshPlayers() {
        playersLoading.classList.remove('hidden');
        playersError.classList.add('hidden');
        playersEmpty.classList.add('hidden');
        playersList.classList.add('hidden');
        const data = await API.players();
        playersLoading.classList.add('hidden');
        if (!data || !Array.isArray(data.players)) {
          playersError.classList.remove('hidden');
          onlineCountBadge.textContent = '0';
          playerCountEl.textContent = '0';
          LOG('players data invalid', data);
          return;
        }
        const players = data.players;
        LOG('players loaded', players.length);
        onlineCountBadge.textContent = players.length;
        playerCountEl.textContent = players.length;
        if (players.length === 0) {
          playersEmpty.classList.remove('hidden');
          return;
        }
        playersList.classList.remove('hidden');
        playersList.innerHTML = '';
        for (const p of players) {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between p-2 rounded bg-gray-800/50 hover:bg-gray-800 group';
          li.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold text-xs flex-shrink-0">${p.name[0].toUpperCase()}</div>
              <span class="text-sm truncate">${escapeHtml(p.name)}</span>
            </div>
            <div class="flex gap-1 opacity-0 group-hover:opacity-100">
              <button class="text-xs bg-gray-600 hover:bg-emerald-600 text-white px-2 py-0.5 rounded status-btn">状态</button>
              <button class="text-xs bg-gray-600 hover:bg-amber-600 text-white px-2 py-0.5 rounded log-btn">日志</button>
              <button class="text-xs bg-gray-600 hover:bg-red-600 text-white px-2 py-0.5 rounded death-btn">死亡</button>
            </div>`;
          li.querySelector('.status-btn').addEventListener('click', () => showPlayerStatus(p.name));
          li.querySelector('.log-btn').addEventListener('click', () => {
            logPlayerInput.value = p.name;
            searchBlockLogs(p.name);
          });
          li.querySelector('.death-btn').addEventListener('click', () => {
            deathPlayerInput.value = p.name;
            searchDeathLogs(p.name);
          });
          playersList.appendChild(li);
        }
      }

      // 状态弹窗
      async function showPlayerStatus(name) {
        statusModal.classList.remove('hidden');
        modalPlayerName.textContent = name;
        modalContent.innerHTML = '<div class="animate-pulse text-gray-400">加载中...</div>';
        try {
          const data = await API.playerStatus(name);
          if (data.error) throw new Error(data.error);
          LOG('status data for', name, data);
          const dims = ['主世界','下界','末地'];
          const gamemodes = ['生存','创造','冒险','','','旁观'];
          const effHtml = (data.effects || []).map(e => `<span class="bg-gray-700 px-2 py-0.5 rounded text-xs">ID:${e.id} 等级:${e.amplifier} 剩余:${(e.duration/20).toFixed(1)}s</span>`).join('');
          modalContent.innerHTML = `
            <div class="grid grid-cols-2 gap-2">
              <div><span class="text-gray-400">生命：</span>${data.health}/${data.max_health}</div>
              <div><span class="text-gray-400">饥饿：</span>${data.hunger.toFixed(1)}</div>
              <div><span class="text-gray-400">饱和度：</span>${data.saturation.toFixed(1)}</div>
              <div><span class="text-gray-400">经验：</span>${data.experience.toFixed(2)} (等级 ${data.level})</div>
              <div><span class="text-gray-400">维度：</span>${dims[data.dimension] || data.dimension}</div>
              <div><span class="text-gray-400">坐标：</span>${data.position.map(v=>v.toFixed(1)).join(', ')}</div>
              <div><span class="text-gray-400">模式：</span>${gamemodes[data.gamemode] || data.gamemode}</div>
            </div>
            <div class="mt-3"><span class="text-gray-400">药水效果：</span><div class="flex flex-wrap gap-1 mt-1">${effHtml || '无'}</div></div>`;
        } catch(e) {
          modalContent.innerHTML = `<span class="text-red-400">加载失败：${e.message}</span>`;
          ERR('failed to get status for', name, e);
        }
      }
      document.getElementById('close-modal').addEventListener('click', () => statusModal.classList.add('hidden'));

      // 方块日志
      let blockCursor = null, currentBlockPlayer = null;
      async function searchBlockLogs(name, loadMore=false) {
        if (!loadMore) {
          currentBlockPlayer = name; blockCursor = null;
          logInitial.classList.add('hidden'); logError.classList.add('hidden'); logEmpty.classList.add('hidden'); logContent.classList.add('hidden');
          logLoading.classList.remove('hidden');
        }
        try {
          const limit = 20;
          const data = await API.playerActions(name, limit, blockCursor || 0);
          logLoading.classList.add('hidden');
          logContent.classList.remove('hidden');
          const tbody = logTableBody;
          if (!loadMore) tbody.innerHTML = '';
          data.actions.forEach(a => {
            const row = document.createElement('tr');
            row.className = 'log-line';
            row.innerHTML = `<td class="px-3 py-2">${a.action}</td><td class="px-3 py-2 font-mono text-xs">${a.block}</td><td class="px-3 py-2 font-mono text-xs">${a.tool}</td><td class="px-3 py-2">${a.count}</td><td class="px-3 py-2 text-xs">${(a.last_pos||[]).join(',')}</td><td class="px-3 py-2 text-xs">${new Date(a.last_time).toLocaleString()}</td>`;
            tbody.appendChild(row);
          });
          if (data.next_cursor) {
            blockCursor = data.next_cursor;
            logLoadMoreBtn.classList.remove('hidden');
          } else {
            logLoadMoreBtn.classList.add('hidden');
          }
        } catch(e) {
          logLoading.classList.add('hidden');
          logError.classList.remove('hidden');
          ERR('block logs error', e);
        }
      }
      logSearchBtn.addEventListener('click', () => {
        const name = logPlayerInput.value.trim();
        if(!name) return;
        searchBlockLogs(name);
      });
      logLoadMoreBtn.addEventListener('click', () => searchBlockLogs(currentBlockPlayer, true));
      logClearBtn.addEventListener('click', () => {
        logPlayerInput.value = '';
        logInitial.classList.remove('hidden'); logContent.classList.add('hidden'); logError.classList.add('hidden'); logLoading.classList.add('hidden');
      });

      // 死亡记录
      let deathCursor = null, currentDeathPlayer = null;
      async function searchDeathLogs(name, loadMore=false) {
        if (!loadMore) {
          currentDeathPlayer = name; deathCursor = null;
          deathInitial.classList.add('hidden'); deathError.classList.add('hidden'); deathEmpty.classList.add('hidden'); deathContent.classList.add('hidden');
          deathLoading.classList.remove('hidden');
        }
        try {
          const limit = 20;
          const data = await API.playerDeaths(name, limit, deathCursor || 0);
          deathLoading.classList.add('hidden');
          deathContent.classList.remove('hidden');
          const tbody = deathTableBody;
          if (!loadMore) tbody.innerHTML = '';
          data.deaths.forEach(d => {
            const row = document.createElement('tr');
            row.innerHTML = `<td class="px-3 py-2 text-xs">${new Date(d.time).toLocaleString()}</td><td class="px-3 py-2">${['主世界','下界','末地'][d.dimension]||d.dimension}</td><td class="px-3 py-2 font-mono text-xs">${d.position.join(', ')}</td><td class="px-3 py-2">${d.cause}</td><td class="px-3 py-2">${d.attacker||'--'}</td>`;
            tbody.appendChild(row);
          });
          if (data.next_cursor) {
            deathCursor = data.next_cursor;
            deathLoadMoreBtn.classList.remove('hidden');
          } else {
            deathLoadMoreBtn.classList.add('hidden');
          }
        } catch(e) {
          deathLoading.classList.add('hidden');
          deathError.classList.remove('hidden');
          ERR('death logs error', e);
        }
      }
      deathSearchBtn.addEventListener('click', () => {
        const name = deathPlayerInput.value.trim();
        if(!name) return;
        searchDeathLogs(name);
      });
      deathLoadMoreBtn.addEventListener('click', () => searchDeathLogs(currentDeathPlayer, true));
      deathClearBtn.addEventListener('click', () => {
        deathPlayerInput.value = '';
        deathInitial.classList.remove('hidden'); deathContent.classList.add('hidden'); deathError.classList.add('hidden'); deathLoading.classList.add('hidden');
      });

      // 初始化
      refreshStatus();
      refreshPlayers();
      document.getElementById('refresh-btn').addEventListener('click', () => { refreshStatus(); refreshPlayers(); });
      setInterval(() => { refreshStatus(); refreshPlayers(); }, 30000);
    })();
