name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type: [server]
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Build
        run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y
          xmake

      - name: Prepare artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item -Recurse -Force bin/* artifact/
          New-Item -ItemType Directory -Force -Path artifact/data/web
          Copy-Item -Recurse -Force assets/web/* artifact/data/web/
          Copy-Item -Force CHANGELOG.md, LICENSE, README.md, manifest.json artifact/

      - name: Zip artifact
        run: |
          Compress-Archive -Path artifact/* -DestinationPath WebPanel-${{ matrix.target_type }}-windows-x64.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: WebPanel-${{ matrix.target_type }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}