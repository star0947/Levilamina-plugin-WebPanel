name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type: [server]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Restore cached xmake dependencies
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}

      - name: Build
        run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y
          xmake

      - name: Prepare artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item -Recurse -Force bin/* artifact/
          if (Test-Path assets/web) {
            New-Item -ItemType Directory -Force -Path artifact/data/web
            Copy-Item -Recurse -Force assets/web/* artifact/data/web/
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: WebPanel-${{ matrix.target_type }}
          path: artifact/